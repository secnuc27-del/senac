<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendário — Espaços Senac</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .nav-text { display: none; }
    @media (min-width: 640px) { .nav-text { display: inline; } }

    .day-cell.holiday {
      border-color: #d97706 !important;
      background: rgba(245, 158, 11, 0.08) !important;
      color: #92400e !important;
      cursor: pointer;
      pointer-events: auto;
    }
    .day-cell.holiday .dot { background: #d97706 !important; }
    .day-cell.holiday .day-holiday-label {
      font-size: 0.52rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #b45309;
      margin-top: 2px;
      line-height: 1.1;
      max-width: 44px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Feriado no card do mês */
    .month-card-holiday {
      font-size: 0.7rem;
      color: #b45309;
      background: rgba(245, 158, 11, 0.1);
      border-radius: 4px;
      padding: 2px 6px;
      font-weight: 600;
      margin-top: 4px;
      display: inline-block;
    }

    /* Badge feriado no topo da view do dia */
    .holiday-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.875rem;
      color: #92400e;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .holiday-banner svg { width: 18px; height: 18px; color: #d97706; flex-shrink: 0; }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="Senac">
        <div class="logo-text">
          <span class="logo-text-main" id="header-espaco-nome">Sistema</span>
          <span class="logo-text-sub">Reservas • Calendário</span>
        </div>
      </a>
      <nav>
        <a href="index.html" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span class="nav-text">Início</span>
        </a>
        <a href="calendario.html" class="nav-link active" id="nav-calendario-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>
          <span class="nav-text">Calendário</span>
        </a>
        <a href="reservas.html" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/><path d="m3 12 2 2 4-4"/></svg>
          <span class="nav-text">Reservas</span>
        </a>
        <a href="admin.html" class="nav-link nav-admin-hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 9.7a1 1 0 0 1-.68 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 .76-.97l8-2a1 1 0 0 1 .48 0l8 2A1 1 0 0 1 20 6Z"/></svg>
          <span class="nav-text">Admin</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- Main Content Page -->
  <main class="page">
    <div id="calendar-container">
      <!-- Dynamic Content Loaded by JS -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>© <span id="footer-year">2026</span> Senac · Sistema interno</p>
    </div>
  </footer>

  <script src="reservations.js"></script>
  <script>
    document.getElementById("footer-year").textContent = new Date().getFullYear();

    // Espaço ativo
    const espaco = getEspacoAtivo();
    document.getElementById("header-espaco-nome").textContent = espaco.nome;
    document.title = `Calendário — ${espaco.nome}`;
    const espacoParam = `espaco=${espaco.id}`;

    // Atualiza links de navegação com o parâmetro de espaço
    document.getElementById("nav-calendario-link").href = `calendario.html?${espacoParam}`;

    const currentYear = new Date().getFullYear();
    const queryYear = getQueryParam("ano");
    const year = queryYear ? parseInt(queryYear, 10) : currentYear;
    const mesParam = getQueryParam("mes");

    const container = document.getElementById("calendar-container");

    // Re-renderiza o calendário quando o Firebase sincronizar novas reservas
    window.addEventListener("reservations-changed", () => {
      if (mesParam) {
        const mes = parseInt(mesParam, 10);
        if (mes >= 1 && mes <= 12) {
          renderMonthView(year, mes);
        } else {
          renderYearView(year);
        }
      } else {
        renderYearView(year);
      }
    });

    // Render inicial
    if (mesParam) {
      const mes = parseInt(mesParam, 10);
      if (mes >= 1 && mes <= 12) {
        renderMonthView(year, mes);
      } else {
        renderYearView(year);
      }
    } else {
      renderYearView(year);
    }

    // Renders the full 12 months overview
    function renderYearView(y) {
      const feriadosAno = getFeriadosDoAno(y);

      container.innerHTML = `
        <div class="page-header">
          <div class="page-title-area">
            <h1 class="page-title">Calendário Anual</h1>
            <p class="page-subtitle"><strong>${espaco.nome}${espaco.sala ? ' • ' + espaco.sala : ''}</strong> • Selecione um mês para ver os dias disponíveis.</p>
          </div>
          <div class="year-selector">
            <button class="year-btn" id="prev-year" aria-label="Ano anterior">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <span class="year-display">${y}</span>
            <button class="year-btn" id="next-year" aria-label="Próximo ano">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
        </div>

        <div class="months-grid" id="months-grid-container"></div>

        <div class="legend-bar">
          <span style="font-weight: 700; color: var(--foreground); margin-right: 4px;">Legenda:</span>
          <div class="legend-item"><span class="legend-color" style="background: var(--success);"></span> Disponível</div>
          <div class="legend-item"><span class="legend-color" style="background: var(--warning);"></span> Parcialmente ocupado</div>
          <div class="legend-item"><span class="legend-color" style="background: var(--danger);"></span> Totalmente reservado</div>
          <div class="legend-item"><span class="legend-color" style="background: var(--past);"></span> Data passada</div>
          <div class="legend-item"><span class="legend-color" style="background: #d97706;"></span> Feriado</div>
        </div>
      `;

      // Year selector event listeners
      document.getElementById("prev-year").addEventListener("click", () => {
        window.location.href = `calendario.html?${espacoParam}&ano=${y - 1}`;
      });
      document.getElementById("next-year").addEventListener("click", () => {
        window.location.href = `calendario.html?${espacoParam}&ano=${y + 1}`;
      });

      const grid = document.getElementById("months-grid-container");
      const reservations = getReservations(espaco.id);

      MONTHS_PT.forEach((name, idx) => {
        const monthNum = idx + 1;
        const monthPrefix = `${y}-${pad(monthNum)}`;
        const count = reservations.filter(r => r.date.startsWith(monthPrefix)).length;

        // Conta feriados neste mês
        const feriadosMes = Object.entries(feriadosAno)
          .filter(([d]) => d.startsWith(monthPrefix));
        const feriadoCount = feriadosMes.length;

        const card = document.createElement("a");
        card.className = "month-card";
        card.href = `calendario.html?${espacoParam}&ano=${y}&mes=${monthNum}`;

        const feriadoBadge = feriadoCount > 0
          ? `<span class="month-card-holiday">🎌 ${feriadoCount} feriado${feriadoCount > 1 ? "s" : ""}</span>`
          : "";

        card.innerHTML = `
          <div class="month-card-num">Mês ${pad(monthNum)}</div>
          <div class="month-card-name">${name}</div>
          <div class="month-card-year">${y}</div>
          ${feriadoBadge}
          <div class="month-card-stats" style="margin-top: 10px;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="opacity: 0.7;">
              <path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>
            </svg>
            ${count} reserva(s)
          </div>
          <div class="month-card-arrow">Ver dias →</div>
        `;
        grid.appendChild(card);
      });
    }

    // Renders the specific calendar grid of a month
    function renderMonthView(y, m) {
      const monthName = MONTHS_PT[m - 1];
      const feriadosAno = getFeriadosDoAno(y);

      container.innerHTML = `
        <a href="calendario.html?${espacoParam}&ano=${y}" class="back-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Voltar ao calendário anual
        </a>

        <div class="page-header" style="margin-bottom: 24px;">
          <div class="page-title-area">
            <h1 class="page-title">${monthName} <span style="font-weight: 400; color: var(--muted-foreground);">${y}</span></h1>
            <p class="page-subtitle"><strong>${espaco.nome}${espaco.sala ? ' • ' + espaco.sala : ''}</strong> • Clique em um dia para visualizar os horários e reservar.</p>
          </div>
        </div>

        <div class="calendar-wrapper">
          <div class="weekdays-grid">
            <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
          </div>
          <div class="days-grid" id="days-grid-container"></div>
        </div>

        <div class="legend-bar">
          <span style="font-weight: 700; color: var(--foreground); margin-right: 4px;">Legenda:</span>
          <div class="legend-item"><span class="legend-color" style="background: var(--success);"></span> Disponível</div>
          <div class="legend-item"><span class="legend-color" style="background: var(--warning);"></span> Parcialmente ocupado</div>
          <div class="legend-item"><span class="legend-color" style="background: var(--danger);"></span> Totalmente reservado</div>
          <div class="legend-item"><span class="legend-color" style="background: var(--past);"></span> Data passada</div>
          <div class="legend-item"><span class="legend-color" style="background: #d97706;"></span> Feriado</div>
        </div>
      `;

      const daysInMonth = new Date(y, m, 0).getDate();
      const firstDayWeekday = new Date(y, m - 1, 1).getDay(); // 0 = Sun, 6 = Sat

      const grid = document.getElementById("days-grid-container");

      // Empty slots for weekday offset
      for (let i = 0; i < firstDayWeekday; i++) {
        const emptyCell = document.createElement("div");
        emptyCell.className = "day-cell empty";
        grid.appendChild(emptyCell);
      }

      // Render days of the month
      for (let d = 1; d <= daysInMonth; d++) {
        const iso = toISODate(y, m - 1, d);
        const status = getDayStatus(iso, espaco.id);
        const feriadoNome = feriadosAno[iso] || null;

        // Feriado: exibe como célula clicável que abre a view do dia
        if (feriadoNome) {
          const cell = document.createElement("a");
          cell.className = "day-cell holiday";
          cell.href = `dia.html?data=${iso}&${espacoParam}`;
          cell.title = feriadoNome;
          cell.style.animationDelay = `${(d * 0.012).toFixed(3)}s`;
          // Pega só a primeira palavra do feriado para caber no card
          const labelCurto = feriadoNome.split(" ").slice(0, 2).join(" ");
          cell.innerHTML = `
            <span>${d}</span>
            <span class="day-holiday-label">${labelCurto}</span>
            <span class="dot"></span>
          `;
          grid.appendChild(cell);
          continue;
        }

        const cell = document.createElement("a");
        cell.className = `day-cell ${status}`;
        cell.href = `dia.html?data=${iso}&${espacoParam}`;
        cell.style.animationDelay = `${(d * 0.012).toFixed(3)}s`;

        cell.innerHTML = `
          <span>${d}</span>
          <span class="dot"></span>
        `;
        grid.appendChild(cell);
      }
    }
  </script>
</body>
</html>
